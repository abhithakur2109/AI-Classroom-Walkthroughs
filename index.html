<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a3a6b">
<title>Walkthrough</title>
<style>
:root{--navy:#1a3a6b;--blue:#1a73e8;--red:#d93025;--green:#188038;--amber:#b06000;--bg:#f4f7fc;--card:#fff;--line:#dfe5f0;--muted:#5f6368}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#202124;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header{text-align:center;margin:8px 0 18px}
h1{margin:0;font-size:24px;color:var(--navy)}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.pill{display:block;width:fit-content;margin:0 auto;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;background:#e8eaed;color:var(--muted)}
.pill.live{background:#e6f4ea;color:var(--green)}
.pill.busy{background:#fef3e0;color:var(--amber)}
.pill.done{background:#e6f4ea;color:var(--green)}
.pill.err{background:#fce8e6;color:var(--red)}
#go{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:22px auto;width:176px;height:176px;border-radius:50%;border:0;background:var(--blue);color:#fff;box-shadow:0 10px 30px rgba(26,115,232,.35);cursor:pointer;transition:transform .15s,background .2s;font-family:inherit}
#go:active{transform:scale(.96)}
#go svg{width:64px;height:64px;fill:currentColor}
#lbl{font-size:14px;font-weight:600;margin-top:6px}
#go.on{background:var(--red);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,48,37,.5)}70%{box-shadow:0 0 0 30px rgba(217,48,37,0)}100%{box-shadow:0 0 0 0 rgba(217,48,37,0)}}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:14px}
summary{cursor:pointer;color:var(--muted);font-weight:600}
#key{width:100%;padding:10px;margin-top:10px;border:1px solid var(--line);border-radius:8px;font-size:15px}
#log{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.b{max-width:86%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4}
.b.ai{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.b.him{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.sys{align-self:center;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Classroom Walkthrough</h1>
    <p class="sub">Tap. Talk. Doc and email done.</p>
  </header>
  <span id="status" class="pill">Ready</span>
  <button id="go" aria-label="Start or stop walkthrough">
    <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    <span id="lbl">Tap to start</span>
  </button>
  <details id="cfg">
    <summary id="keystate">Settings: API key</summary>
    <input id="key" type="password" placeholder="Gemini API key" autocomplete="off">
  </details>
  <div id="log"></div>
</div>
<script>
const MODEL = 'gemini-3.1-flash-live-preview'; // fallback: gemini-2.5-flash-native-audio-preview-12-2025
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyJWtqEfWLwLqdfk6k_9QqTWpj6qtbvtWdFjMGN1WFyvE36KDUtE628pDC7Snq7NmWc/exec';
const PIN = '1234';
const GATE_IDLE = 0.015;  // mic level to count as speech when AI quiet
const GATE_AI   = 0.05;   // higher bar to interrupt AI while it talks
const HANG_FRAMES = 2;    // keep mic open ~0.5s after speech
const ROSTER = ['Test Teacher', 'Mr. McAlpine', 'Ms. Smith']; // spelling hint only
const LOOKFORS = ['Learning objective posted','Students on task','Student discussion','Small group work','Questioning','Technology used','Differentiation'];

const SYSTEM = `You are a voice assistant for a superintendent doing a classroom walkthrough. Be brief, friendly, fast.
Collect ALL of these. Every one is required, none may be blank: teacher name, room, period, subject, look-fors (at least one), engagement (Low/Moderate/High), evidence notes, one strength, follow-up needed (yes/no).
Ask about evidence notes and strength explicitly. If he says none, nothing, or skips, store exactly "None noted".
Any teacher name is allowed. Never list or read the roster aloud. Roster is only a spelling hint: ${ROSTER.join(', ')}. If what you heard is close to a roster name, use that spelling. Otherwise accept the name as heard.
Repeat the teacher name aloud and ask "right?". If he corrects you, accept his correction. If name unclear, ask him to spell it.
Ask one question at a time. Accept answers out of order. Skip anything already answered.
Repeat room and period aloud digit by digit right after hearing them, ask "right?" before moving on.
Do not read option lists unless he asks. Listen to what he says and map it to the allowed look-fors: ${LOOKFORS.join(', ')}. If unsure, ask which one he means.
Final read-back must include teacher, room, period, subject, look-fors, engagement, notes, strength, follow-up. Never skip a field. Then ask "Correct?".
Only after he says yes, call save_walkthrough once. If the result says fields are missing, ask him for exactly those, then confirm and call again. When the result says saved, say the confirmation it gives. After that, say nothing more.`;

const TOOLS = [{functionDeclarations:[{
  name:'save_walkthrough',
  description:'Save confirmed walkthrough. Call only once, only after user confirms read-back.',
  parameters:{type:'OBJECT',properties:{
    teacher:{type:'STRING'},
    room:{type:'STRING'}, period:{type:'STRING'}, subject:{type:'STRING'},
    lookFors:{type:'ARRAY',items:{type:'STRING',enum:LOOKFORS}},
    engagement:{type:'STRING',enum:['Low','Moderate','High']},
    notes:{type:'STRING'}, strength:{type:'STRING'}, followUp:{type:'BOOLEAN'},
    highlight:{type:'STRING',description:'Max 2 sentences.'}
  },required:['teacher','room','period','subject','lookFors','engagement','notes','strength','followUp','highlight']}
}]}];

const $ = id => document.getElementById(id);
const logEl = $('log');
let lastWho = '', cur = null, saved = false, saving = false;
const scrollDown = () => window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
function say(who, t){
  if(who !== lastWho || !cur){
    cur = document.createElement('div');
    cur.className = 'b ' + (who === 'HIM' ? 'him' : 'ai');
    logEl.appendChild(cur); lastWho = who;
  }
  cur.textContent += t; scrollDown();
}
function log(t){
  const d = document.createElement('div');
  d.className = 'sys'; d.textContent = t;
  logEl.appendChild(d); lastWho = ''; cur = null; scrollDown();
}
function setStatus(text, cls){ const s = $('status'); s.textContent = text; s.className = 'pill ' + cls; }

try{
  if(localStorage.getItem('gk')){ $('cfg').open = false; $('keystate').textContent = 'Settings: key saved on this device'; }
  else $('cfg').open = true;
}catch{}

let ws, micCtx, outCtx, proc, stream, nextT = 0, running = false, active = [];

const b64 = buf => { let s=''; const u=new Uint8Array(buf); for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;

function play(b64pcm){
  const i16 = new Int16Array(unb64(b64pcm));
  const f32 = Float32Array.from(i16, v => v/32768);
  const buf = outCtx.createBuffer(1, f32.length, 24000);
  buf.copyToChannel(f32, 0);
  const src = outCtx.createBufferSource();
  src.buffer = buf; src.connect(outCtx.destination);
  src.onended = () => { active = active.filter(s => s !== src); };
  active.push(src);
  nextT = Math.max(nextT, outCtx.currentTime);
  src.start(nextT); nextT += buf.duration;
}
function flush(){
  active.forEach(s => { try{s.stop()}catch{} });
  active = []; nextT = 0;
}

const REQUIRED = ['teacher','room','period','subject','lookFors','engagement','notes','strength','followUp','highlight'];
function missingFields(a){
  return REQUIRED.filter(k => {
    const v = a[k];
    if(k === 'followUp') return typeof v !== 'boolean';
    if(Array.isArray(v)) return v.length === 0;
    return v === undefined || v === null || String(v).trim() === '';
  });
}
  
async function saveToServer(args){
  try{
    const res = await fetch(SCRIPT_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({pin:PIN,...args})
    });

    if(!res.ok){
      return {ok:false,error:'HTTP error ' + res.status};
    }

    let j;
    try{
      j = await res.json();
    }catch(e){
      return {ok:false,error:'Server response could not be verified'};
    }

    if(!j || j.ok !== true){
      return {ok:false,error:(j && j.error) || 'Server rejected the save'};
    }

    return {ok:true};

  }catch(e){
    return {ok:false,error:'Network error. Save could not be verified.'};
  }
}

async function start(){
  let key = $('key').value.trim();
  if(!key){ try{ key = localStorage.getItem('gk') || ''; }catch{} }
  if(!key){ $('cfg').open = true; setStatus('Enter API key','err'); return; }
  try{ localStorage.setItem('gk', key); }catch{}
  saved = false; saving = false;
  setStatus('Connecting…','busy');
  try{
    outCtx = new AudioContext({sampleRate:24000});
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(e){ setStatus('Mic blocked','err'); return; }
  micCtx = new AudioContext({sampleRate:16000});
  const src = micCtx.createMediaStreamSource(stream);
  proc = micCtx.createScriptProcessor(4096,1,1);
  src.connect(proc); proc.connect(micCtx.destination);

  let hang = 0;
  proc.onaudioprocess = e => {
    if(!ws || ws.readyState !== 1 || !ws.ready) return;
    const f = e.inputBuffer.getChannelData(0);
    let sum = 0;
    for(let i=0;i<f.length;i++) sum += f[i]*f[i];
    const rms = Math.sqrt(sum / f.length);
    const thr = active.length ? GATE_AI : GATE_IDLE;
    if(rms > thr) hang = HANG_FRAMES; else if(hang > 0) hang--;
    const i16 = new Int16Array(f.length); // zeros = silence when gate closed
    if(hang > 0){
      for(let i=0;i<f.length;i++) i16[i] = Math.max(-1,Math.min(1,f[i]))*32767;
    }
    ws.send(JSON.stringify({realtimeInput:{audio:{data:b64(i16.buffer),mimeType:'audio/pcm;rate=16000'}}}));
  };

  ws = new WebSocket(`wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${key}`);
  ws.onopen = () => ws.send(JSON.stringify({setup:{
    model:`models/${MODEL}`,
    generationConfig:{responseModalities:['AUDIO']},
    systemInstruction:{parts:[{text:SYSTEM}]},
    tools:TOOLS,
    realtimeInputConfig:{
      automaticActivityDetection:{
        startOfSpeechSensitivity:'START_SENSITIVITY_LOW',
        endOfSpeechSensitivity:'END_SENSITIVITY_LOW',
        prefixPaddingMs:200,
        silenceDurationMs:900
      }
    },
    inputAudioTranscription:{}, outputAudioTranscription:{}
  }}));

  ws.onmessage = async ev => {
    const m = JSON.parse(typeof ev.data === 'string' ? ev.data : await ev.data.text());
    if(m.setupComplete){
      ws.ready = true; setStatus('Listening','live');
      ws.send(JSON.stringify({realtimeInput:{text:'Begin the walkthrough.'}}));
    }
    const sc = m.serverContent;
    if(sc){
      if(sc.interrupted) flush();
      (sc.modelTurn?.parts||[]).forEach(p => p.inlineData && play(p.inlineData.data));
      if(sc.inputTranscription) say('HIM', sc.inputTranscription.text);
      if(sc.outputTranscription) say('AI', sc.outputTranscription.text);
    }
    if(m.toolCall){
      const responses = [];
      for(const fc of m.toolCall.functionCalls){
        if(saved || saving){
          responses.push({id:fc.id,name:fc.name,response:{result:'Already saved. Do not call again. Say nothing.'}});
          continue;
          
        }
        const miss = missingFields(fc.args || {});
        if(miss.length){
          log('Missing: ' + miss.join(', '));
          responses.push({id:fc.id,name:fc.name,response:{result:'NOT saved. Missing fields: ' + miss.join(', ') + '. Ask him for each one. If he has nothing for notes or strength, use "None noted". Then read back and call save_walkthrough again.'}});
          continue;
        }
        saving = true;
        setStatus('Saving…','busy'); log('Saving walkthrough…');
        const r = await saveToServer(fc.args);
        saving = false;
        let result;
        if(r.ok){
          saved = true;
          setStatus('Saved ✓','done'); log('Saved to Google Sheet. Doc and email on the way.');
          result = 'Saved successfully. Now say this: "Saved. It\'s added to the Google Sheet, and the Doc link is on its way to your email." Then stop talking.';
        }else{
          setStatus('Save failed','err'); log('Save failed: ' + r.error);
          result = 'Save FAILED. Tell him it did not save and ask him to try again later. Do not claim it was saved.';
        }
        responses.push({id:fc.id,name:fc.name,response:{result}});
      }
      ws.send(JSON.stringify({toolResponse:{functionResponses:responses}}));
    }
  };

  ws.onerror = () => setStatus('Connection error','err');
  ws.onclose = e => { if(e.code !== 1000) log('Connection closed (' + (e.reason||e.code) + ')'); stop(); };
  running = true; $('go').classList.add('on'); $('lbl').textContent = 'Tap to stop';
}

function stop(){
  running = false;
  flush();
  try{ws && ws.close()}catch{}
  try{proc && proc.disconnect()}catch{}
  try{stream && stream.getTracks().forEach(t => t.stop())}catch{}
  $('go').classList.remove('on'); $('lbl').textContent = 'Tap to start';
  const cls = $('status').className;
  if(saved) setStatus('Saved ✓','done');
  else if(cls.indexOf('err') < 0) setStatus('Ready','');
}

$('go').onclick = () => running ? stop() : start();
</script>
</body>
</html>
