<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a3a6b">
<title>Walkthrough</title>
<style>
:root{--navy:#1a3a6b;--blue:#1a73e8;--red:#d93025;--green:#188038;--amber:#b06000;--bg:#f4f7fc;--card:#fff;--line:#dfe5f0;--muted:#5f6368}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#202124;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header{text-align:center;margin:8px 0 18px}
h1{margin:0;font-size:24px;color:var(--navy)}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.pill{display:block;width:fit-content;margin:0 auto;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;background:#e8eaed;color:var(--muted)}
.pill.live{background:#e6f4ea;color:var(--green)}
.pill.busy{background:#fef3e0;color:var(--amber)}
.pill.done{background:#e6f4ea;color:var(--green)}
.pill.err{background:#fce8e6;color:var(--red)}
#go{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:22px auto;width:176px;height:176px;border-radius:50%;border:0;background:var(--blue);color:#fff;box-shadow:0 10px 30px rgba(26,115,232,.35);cursor:pointer;transition:transform .15s,background .2s;font-family:inherit}
#go:active{transform:scale(.96)}
#go svg{width:64px;height:64px;fill:currentColor}
#lbl{font-size:14px;font-weight:600;margin-top:6px}
#go.on{background:var(--red);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,48,37,.5)}70%{box-shadow:0 0 0 30px rgba(217,48,37,0)}100%{box-shadow:0 0 0 0 rgba(217,48,37,0)}}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:14px}
summary{cursor:pointer;color:var(--muted);font-weight:600}
#key{width:100%;padding:10px;margin-top:10px;border:1px solid var(--line);border-radius:8px;font-size:15px}
#log{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.b{max-width:86%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4}
.b.ai{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.b.him{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.sys{align-self:center;font-size:12px;color:var(--muted)}
.sys.warn{color:var(--red);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.45}
.card h3{margin:0 0 6px;font-size:15px;color:var(--navy)}
.card p{margin:4px 0}
.card .note{color:var(--muted);font-size:13px}
.card ol{margin:6px 0 0;padding-left:20px}
.card li{margin:7px 0}
.sum{white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Classroom Walkthrough</h1>
    <p class="sub">Tap. Talk. Sheet and feedback done.</p>
  </header>
  <span id="status" class="pill">Ready</span>
  <button id="go" aria-label="Start or stop walkthrough">
    <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    <span id="lbl">Tap to start</span>
  </button>
  <details id="cfg">
    <summary id="keystate">Settings: API key</summary>
    <input id="key" type="password" placeholder="Gemini API key" autocomplete="off">
  </details>
  <div id="log"></div>
</div>
<script>
const MODEL = 'gemini-3.1-flash-live-preview'; // fallback: gemini-2.5-flash-native-audio-preview-12-2025
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyJWtqEfWLwLqdfk6k_9QqTWpj6qtbvtWdFjMGN1WFyvE36KDUtE628pDC7Snq7NmWc/exec';
const PIN = '1234';
const GATE_IDLE = 0.015;  // mic level to count as speech when AI quiet
const GATE_AI   = 0.05;   // higher bar to interrupt AI while it talks
const HANG_FRAMES = 2;    // keep mic open ~0.5s after speech
let ROSTER = [];          // loaded from the Roster tab, spelling hint only

const INTRO = 'These questions are district level. These questions help us understand how differentiated and personalized learning practices are showing up across classrooms and to monitor our progress toward the Purposeful Learning OKR strategy of empowering and supporting educators. DLT and ALT will have opportunities throughout the year to review this data, celebrate strengths, and evaluate progress.';

const DIFF = [
  ['Differentiated Instruction','Adjusted instruction, grouping, pacing, questioning, or support based on student data, readiness, and learning needs.'],
  ['Differentiated Tasks','Students worked toward the same rigorous learning goal with varied levels of support, materials, pathways, or complexity.']
];
const PERS = [
  ['Goal Setting','Students set, monitored, or adjusted goals based on their learning and progress.'],
  ['Self-Reflection','Students reflected on their learning, growth, strengths, or next steps.'],
  ['Student Voice','Students influenced what and how they learned by contributing to the topics, questions, direction, or pathways of the learning experience.'],
  ['Collaboration','Students worked with others to deepen understanding, exchange ideas, or solve problems.'],
  ['Varied Demonstration of Learning','Students demonstrated their understanding through different products, formats, or modes of expression.'],
  ['Strengths-Based Learning','Students identified and used their strengths, interests, or preferred approaches to support their learning.'],
  ['Portrait of a Comet Skills','Students intentionally practiced or reflected on adaptability, communication, empathy, integrity, or critical thinking.']
];
const DIFF_NAMES = DIFF.map(o => o[0]).concat('None');
const PERS_NAMES = PERS.map(o => o[0]).concat('None');
const numbered = a => a.map((o,i) => (i+1) + ' = ' + o[0]).join('; ');

function buildSystem(){
return `You are a voice assistant for a school administrator doing a classroom walkthrough. Be brief, friendly, fast. Follow this exact order, one step at a time.
Every answer is required. If he says "None", store "None". Never leave anything blank.
Accept answers given out of order and skip anything already answered, but still call show_card before the matching question.

STEP 1. Say: "Who is doing the walkthrough?" Get the admin name. Repeat it back and ask "right?". If he corrects you, accept it.
STEP 2. Say: "Teacher name?" Get the teacher name. Repeat it back and ask "right?". Any name is allowed. Never read a roster aloud. Roster is only a spelling hint: ${ROSTER.length ? ROSTER.join(', ') : 'none'}. If what you heard is close to a roster name, use that spelling. If name unclear, ask him to spell it.
STEP 3. Call show_card with card "intro". Do NOT read it aloud. Do not mention it.
STEP 4. Call show_card with card "differentiated". Then say ONLY: "What evidence of differentiated instruction is visible?" Do NOT read the options aloud. They are on screen. He can answer by name or number, several allowed. Numbers: ${numbered(DIFF)}. If he says None, use ["None"].
STEP 5. Call show_card with card "personalized". Then say ONLY: "What evidence of personalized learning is visible?" Do NOT read the options aloud. He can answer by name or number, several allowed. Numbers: ${numbered(PERS)}. If he says None, use ["None"].
STEP 6. Call show_card with card "example". Then say ONLY: "See an inspiring example? Share a brief overview." He talks free-form. Store what he says in a clean sentence or two. If he says None, store "None".
STEP 7. Call show_card with card "feedback". Then say ONLY: "Any 30-second feedback for the teacher?" He talks. Keep his words exactly as he said them. Remove only filler like um or uh. Do not add praise, do not rewrite, do not improve it. If he says None, store "None".
STEP 8. Call show_card with card "additional". Then say ONLY: "Any additional information? This is not shared with the teacher." Store it as he said it. If he says None, store "None".
STEP 9. If feedback is not "None": say ONLY "Send the feedback to the teacher?" Yes means sendToTeacher true. No means false. If feedback is "None": do NOT ask, set sendToTeacher false.
STEP 10. Call show_card with card "summary", text = the full read-back with lines for Admin, Teacher, Differentiated instruction, Personalized learning, Inspiring example, 30-second feedback, Additional information, Send to teacher (yes or no, signed by the admin name). Then read it aloud briefly and ask "Correct?". If he corrects something, fix it, call show_card summary again, read back again.
STEP 11. Only after he says yes: say exactly "Please wait, don't close the app, I am saving the information." Then you MUST call save_walkthrough right away, once. You do NOT know whether it saved until the function result arrives. NEVER say "saved", "done", or "you may close the app" unless a function result tells you to say it. If you have nothing to say, stay silent and wait for the result.
STEP 12. When the function result arrives, say exactly what it tells you to say, then say nothing more. If it says fields are missing, ask for exactly those, confirm, and call again. If it says the save failed, tell him it did not save.

Map selections only to these exact names. Differentiated: ${DIFF_NAMES.join(', ')}. Personalized: ${PERS_NAMES.join(', ')}.
highlight = one or two plain sentences summarizing what he reported. Do not invent details.`;
}

const TOOLS = [{functionDeclarations:[
  {
    name:'show_card',
    description:'Show an info card on the screen. Call before asking each question.',
    parameters:{type:'OBJECT',properties:{
      card:{type:'STRING',enum:['intro','differentiated','personalized','example','feedback','additional','summary']},
      text:{type:'STRING',description:'Only for summary: the full read-back text.'}
    },required:['card']}
  },
  {
    name:'save_walkthrough',
    description:'Save confirmed walkthrough. Call only once, only after he confirms the read-back. The result says whether it really saved.',
    parameters:{type:'OBJECT',properties:{
      admin:{type:'STRING'},
      teacher:{type:'STRING'},
      differentiated:{type:'ARRAY',items:{type:'STRING',enum:DIFF_NAMES}},
      personalized:{type:'ARRAY',items:{type:'STRING',enum:PERS_NAMES}},
      example:{type:'STRING',description:'Overview, or "None".'},
      feedback:{type:'STRING',description:'His 30-second feedback for the teacher, his own words, filler removed. Or "None".'},
      additional:{type:'STRING',description:'Additional info not shared with teacher, or "None".'},
      sendToTeacher:{type:'BOOLEAN',description:'True only if he said yes to sending feedback. False if feedback is None.'},
      highlight:{type:'STRING',description:'1-2 sentences summarizing what he reported. No invented details.'}
    },required:['admin','teacher','differentiated','personalized','example','feedback','additional','sendToTeacher','highlight']}
  }
]}];

const $ = id => document.getElementById(id);
const logEl = $('log');
let lastWho = '', cur = null, saved = false, saving = false, closeAfter = false, finishing = false;
let resultDelivered = false, awaitingSave = false, aiBuf = '', lastNudge = 0;
const scrollDown = () => window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
function say(who, t){
  if(who !== lastWho || !cur){
    cur = document.createElement('div');
    cur.className = 'b ' + (who === 'HIM' ? 'him' : 'ai');
    logEl.appendChild(cur); lastWho = who;
  }
  cur.textContent += t; scrollDown();
}
function log(t, warn){
  const d = document.createElement('div');
  d.className = 'sys' + (warn ? ' warn' : ''); d.textContent = t;
  logEl.appendChild(d); lastWho = ''; cur = null; scrollDown();
}
function setStatus(text, cls){ const s = $('status'); s.textContent = text; s.className = 'pill ' + cls; }

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const optList = arr => '<ol>' + arr.map(o => `<li><b>${esc(o[0])}</b> – ${esc(o[1])}</li>`).join('') + '</ol>';
function showCard(card, text){
  let h = '';
  if(card === 'intro') h = '<h3>District level questions</h3><p>' + esc(INTRO) + '</p>';
  else if(card === 'differentiated') h = '<h3>Differentiated instruction</h3><p class="note">Select all that apply. Say names or numbers. Say "None" to skip.</p>' + optList(DIFF);
  else if(card === 'personalized') h = '<h3>Personalized learning</h3><p class="note">Select all that apply. Say names or numbers. Say "None" to skip.</p>' + optList(PERS);
  else if(card === 'example') h = '<h3>Inspiring example</h3><p class="note">Overviews will be summarized and added to a shared resource collection. Say "None" to skip.</p>';
  else if(card === 'feedback') h = '<h3>30-second feedback</h3><p class="note">Shared with the teacher by email if you choose to send. Your words go out as you say them. Say "None" to skip.</p>';
  else if(card === 'additional') h = '<h3>Additional information</h3><p class="note">Not shared with the teacher. Saved on the spreadsheet only. Say "None" to skip.</p>';
  else if(card === 'summary') h = '<h3>Read-back</h3><div class="sum">' + esc(text || '') + '</div>';
  else return;
  const d = document.createElement('div');
  d.className = 'card'; d.innerHTML = h;
  logEl.appendChild(d); lastWho = ''; cur = null; scrollDown();
}

try{
  if(localStorage.getItem('gk')){ $('cfg').open = false; $('keystate').textContent = 'Settings: key saved on this device'; }
  else $('cfg').open = true;
}catch{}

let ws, micCtx, outCtx, proc, stream, nextT = 0, running = false, active = [];

const b64 = buf => { let s=''; const u=new Uint8Array(buf); for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
const sendText = t => { if(ws && ws.readyState === 1) ws.send(JSON.stringify({realtimeInput:{text:t}})); };

function play(b64pcm){
  const i16 = new Int16Array(unb64(b64pcm));
  const f32 = Float32Array.from(i16, v => v/32768);
  const buf = outCtx.createBuffer(1, f32.length, 24000);
  buf.copyToChannel(f32, 0);
  const src = outCtx.createBufferSource();
  src.buffer = buf; src.connect(outCtx.destination);
  src.onended = () => { active = active.filter(s => s !== src); };
  active.push(src);
  nextT = Math.max(nextT, outCtx.currentTime);
  src.start(nextT); nextT += buf.duration;
}
function flush(){
  active.forEach(s => { try{s.stop()}catch{} });
  active = []; nextT = 0;
}

const REQUIRED = ['admin','teacher','differentiated','personalized','example','feedback','additional','sendToTeacher','highlight'];
const isNone = s => String(s || '').trim().toLowerCase().replace(/[.!]/g,'') === 'none';
function norm(a){
  const fix = arr => {
    arr = (Array.isArray(arr) ? arr : (arr ? [arr] : [])).filter(Boolean);
    const real = arr.filter(x => x !== 'None');
    return real.length ? real : (arr.length ? ['None'] : []);
  };
  const o = {...a, differentiated: fix(a.differentiated), personalized: fix(a.personalized)};
  if(isNone(o.feedback)) o.sendToTeacher = false;
  return o;
}
function missingFields(a){
  return REQUIRED.filter(k => {
    const v = a[k];
    if(k === 'sendToTeacher') return typeof v !== 'boolean';
    if(Array.isArray(v)) return v.length === 0;
    return v === undefined || v === null || String(v).trim() === '';
  });
}

async function loadRoster(){
  try{
    const c = new AbortController();
    const to = setTimeout(() => c.abort(), 5000);
    const res = await fetch(SCRIPT_URL + '?action=roster&pin=' + encodeURIComponent(PIN), {signal:c.signal});
    clearTimeout(to);
    const j = await res.json();
    if(j && j.ok && Array.isArray(j.names)) ROSTER = j.names;
  }catch(e){ /* hint only, ok to skip */ }
}

async function saveToServer(args){
  try{
    const res = await fetch(SCRIPT_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({pin:PIN,...args})
    });
    if(!res.ok) return {ok:false,error:'HTTP error ' + res.status};
    let j;
    try{ j = await res.json(); }
    catch(e){ return {ok:false,error:'Server response could not be verified'}; }
    if(!j || j.ok !== true) return {ok:false,error:(j && j.error) || 'Server rejected the save'};
    if(j.verified !== true || !j.row) return {ok:false,error:'Row was not verified in the sheet'};
    return {ok:true, emailStatus:j.emailStatus || '', row:j.row};
  }catch(e){
    return {ok:false,error:'Network error. Save could not be verified.'};
  }
}

function finishUp(){
  if(finishing) return;
  finishing = true;
  const t0 = Date.now();
  const iv = setInterval(() => {
    const waited = Date.now() - t0;
    if((active.length === 0 && waited > 800) || waited > 15000){ clearInterval(iv); stop(); }
  }, 300);
}

// Guard: AI must not claim "saved" before the verified result.
function guard(){
  if(/saving the information/i.test(aiBuf)) awaitingSave = true;
  if(!resultDelivered && !saving && !saved && /\bsaved\b|you may close the app/i.test(aiBuf)){
    const now = Date.now();
    if(now - lastNudge < 5000) return;
    lastNudge = now;
    flush(); aiBuf = '';
    log('The AI said "saved" before anything was saved. Corrected. Waiting for the real save.', true);
    setStatus('Not saved yet','err');
    sendText('SYSTEM: Nothing has been saved yet. Do not say it is saved. Call save_walkthrough now with the confirmed answers. Say nothing before calling it.');
  }
}

async function start(){
  let key = $('key').value.trim();
  if(!key){ try{ key = localStorage.getItem('gk') || ''; }catch{} }
  if(!key){ $('cfg').open = true; setStatus('Enter API key','err'); return; }
  try{ localStorage.setItem('gk', key); }catch{}
  saved = false; saving = false; closeAfter = false; finishing = false;
  resultDelivered = false; awaitingSave = false; aiBuf = ''; lastNudge = 0;
  setStatus('Connecting…','busy');
  try{
    outCtx = new AudioContext({sampleRate:24000});
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(e){ setStatus('Mic blocked','err'); return; }
  micCtx = new AudioContext({sampleRate:16000});
  const src = micCtx.createMediaStreamSource(stream);
  proc = micCtx.createScriptProcessor(4096,1,1);
  src.connect(proc); proc.connect(micCtx.destination);

  let hang = 0;
  proc.onaudioprocess = e => {
    if(!ws || ws.readyState !== 1 || !ws.ready) return;
    const f = e.inputBuffer.getChannelData(0);
    let sum = 0;
    for(let i=0;i<f.length;i++) sum += f[i]*f[i];
    const rms = Math.sqrt(sum / f.length);
    const thr = active.length ? GATE_AI : GATE_IDLE;
    if(rms > thr) hang = HANG_FRAMES; else if(hang > 0) hang--;
    const i16 = new Int16Array(f.length); // zeros = silence when gate closed
    if(hang > 0){
      for(let i=0;i<f.length;i++) i16[i] = Math.max(-1,Math.min(1,f[i]))*32767;
    }
    ws.send(JSON.stringify({realtimeInput:{audio:{data:b64(i16.buffer),mimeType:'audio/pcm;rate=16000'}}}));
  };

  await loadRoster();
  if(!running && !stream.active){ return; }

  ws = new WebSocket(`wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${key}`);
  ws.onopen = () => ws.send(JSON.stringify({setup:{
    model:`models/${MODEL}`,
    generationConfig:{responseModalities:['AUDIO']},
    systemInstruction:{parts:[{text:buildSystem()}]},
    tools:TOOLS,
    realtimeInputConfig:{
      automaticActivityDetection:{
        startOfSpeechSensitivity:'START_SENSITIVITY_LOW',
        endOfSpeechSensitivity:'END_SENSITIVITY_LOW',
        prefixPaddingMs:200,
        silenceDurationMs:900
      }
    },
    inputAudioTranscription:{}, outputAudioTranscription:{}
  }}));

  ws.onmessage = async ev => {
    const m = JSON.parse(typeof ev.data === 'string' ? ev.data : await ev.data.text());
    if(m.setupComplete){
      ws.ready = true; setStatus('Listening','live');
      ws.send(JSON.stringify({realtimeInput:{text:'Begin the walkthrough.'}}));
    }
    const sc = m.serverContent;
    if(sc){
      if(sc.interrupted){ flush(); aiBuf = ''; }
      (sc.modelTurn?.parts||[]).forEach(p => p.inlineData && play(p.inlineData.data));
      if(sc.inputTranscription){ say('HIM', sc.inputTranscription.text); aiBuf = ''; }
      if(sc.outputTranscription){
        say('AI', sc.outputTranscription.text);
        aiBuf = (aiBuf + sc.outputTranscription.text).slice(-120);
        guard();
      }
      if(sc.turnComplete){
        aiBuf = '';
        if(closeAfter) finishUp();
        if(awaitingSave && !saving && !resultDelivered){
          awaitingSave = false;
          setTimeout(() => {
            if(running && !saving && !resultDelivered && !saved){
              log('AI said it was saving but did not save. Telling it to save now.', true);
              sendText('SYSTEM: You said you were saving but have not called save_walkthrough. Call it now with the confirmed answers. Say nothing before calling it.');
            }
          }, 4000);
        }
      }
    }
    if(m.toolCall){
      const responses = [];
      for(const fc of m.toolCall.functionCalls){
        if(fc.name === 'show_card'){
          showCard(fc.args && fc.args.card, fc.args && fc.args.text);
          responses.push({id:fc.id,name:fc.name,response:{result:'shown'}});
          continue;
        }
        if(saved || saving){
          responses.push({id:fc.id,name:fc.name,response:{result:'Already saved. Do not call again. Say nothing.'}});
          continue;
        }
        const args = norm(fc.args || {});
        const miss = missingFields(args);
        if(miss.length){
          log('Missing: ' + miss.join(', '));
          responses.push({id:fc.id,name:fc.name,response:{result:'NOT saved. Missing fields: ' + miss.join(', ') + '. Ask him for each one. If he has nothing, use "None". Then read back and call save_walkthrough again.'}});
          continue;
        }
        saving = true; awaitingSave = false; resultDelivered = false;
        setStatus('Saving, do not close…','busy'); log('Saving walkthrough, please wait…');
        const r = await saveToServer(args);
        saving = false;
        let result;
        if(r.ok){
          saved = true; closeAfter = true; resultDelivered = true;
          setStatus('Saved ✓ verified','done');
          const es = r.emailStatus || '';
          log('Verified in Google Sheet, row ' + r.row + '.' + (es ? ' Email: ' + es + '.' : ''));
          if(es === 'No email match'){
            result = 'VERIFIED saved to the Google Sheet, but no email address was found for that teacher. Say exactly: "Okay, I saved it. No email address was found for that teacher, so the feedback is on the sheet only. You may close the app now." Then stop talking.';
          }else if(es === 'Send failed'){
            result = 'VERIFIED saved to the Google Sheet, but the email could not be sent. Say exactly: "Okay, I saved it. The email could not be sent, but everything is on the sheet. You may close the app now." Then stop talking.';
          }else{
            result = 'VERIFIED saved to the Google Sheet. Say exactly: "Okay, I saved it. You may close the app now." Then stop talking.';
          }
        }else{
          resultDelivered = true;
          setStatus('Save failed','err'); log('Save failed: ' + r.error, true);
          result = 'Save FAILED: ' + r.error + '. Say exactly: "Sorry, it did not save. Please try again." Do not claim it was saved.';
        }
        responses.push({id:fc.id,name:fc.name,response:{result}});
      }
      ws.send(JSON.stringify({toolResponse:{functionResponses:responses}}));
    }
  };

  ws.onerror = () => setStatus('Connection error','err');
  ws.onclose = e => { if(e.code !== 1000) log('Connection closed (' + (e.reason||e.code) + ')'); stop(); };
  running = true; $('go').classList.add('on'); $('lbl').textContent = 'Tap to stop';
}

function stop(){
  running = false;
  flush();
  try{ws && ws.close()}catch{}
  try{proc && proc.disconnect()}catch{}
  try{stream && stream.getTracks().forEach(t => t.stop())}catch{}
  $('go').classList.remove('on'); $('lbl').textContent = 'Tap to start';
  const cls = $('status').className;
  if(saved) setStatus('Saved ✓ verified','done');
  else if(cls.indexOf('err') < 0) setStatus('Ready','');
}

$('go').onclick = () => running ? stop() : start();
</script>
</body>
</html>
